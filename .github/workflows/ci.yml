# CI pipeline for Huellitas.
#
# - checks: typecheck + lint + unit tests on every push to main and every PR.
# - integration: runs the Jest integration suite against a local Supabase
#   stack (Docker). Choice: runs on pull_request only — spinning up the full
#   Supabase stack (~2-4 min of Docker pulls) on every push to main would
#   roughly double CI time for no extra signal, since every change lands
#   through a PR where the suite already ran. No secrets needed: the
#   integration helper resolves keys via `supabase status -o json`.

name: CI

# CI only reads the repo; never grant the default write token to jobs that
# execute third-party lifecycle scripts (npm ci).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests (local Supabase)
    # PR-only by design — see comment at the top of this file.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned to the version the team uses locally; bump deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Integration tests
        run: npm run test:integration
